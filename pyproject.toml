[project]
name = "desercion"
version = "0.1.0"
description = "Sistema de alerta temprana de deserción de aprendices del SENA con prácticas de MLOps"
readme = "README.md"
authors = [
    { name = "aemedina24", email = "aemedina@unal.edu.co" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
]

[project.scripts]
desercion = "desercion:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
