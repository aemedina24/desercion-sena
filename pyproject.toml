[project]
name = "desercion"
version = "0.1.0"
description = "Sistema de alerta temprana de deserción de aprendices del SENA con prácticas de MLOps"
readme = "README.md"
authors = [
    { name = "aemedina24", email = "aemedina@unal.edu.co" }
]
requires-python = ">=3.11"
dependencies = [
    "mlflow-skinny>=3.18.0",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pandera>=0.35.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "skops>=0.16.0",
]

[project.scripts]
desercion = "desercion:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
    "seaborn>=0.13.2",
]
