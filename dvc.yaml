stages:
  process:
    cmd: uv run python -m desercion.process
    deps:
      - data/raw/aprendices.parquet
      - src/desercion/process.py
    outs:
      - data/processed/aprendices.parquet
      - data/processed/auditoria.parquet
  validate:
    cmd: uv run python -m desercion.validate
    deps:
      - data/processed/aprendices.parquet
      - src/desercion/validate.py
    metrics:
      - reports/validacion.json:
          cache: false
  features:
    cmd: uv run python -m desercion.features
    deps:
      - data/processed/aprendices.parquet
      - reports/validacion.json
      - src/desercion/features.py
    outs:
      - data/features/train.parquet
      - data/features/test.parquet
  train:
    cmd: uv run python -m desercion.train_model
    deps:
      - data/features/train.parquet
      - data/features/test.parquet
      - src/desercion/train_model.py
      - src/desercion/modelado.py
    params:
      - config/model/logistic.yaml:
    outs:
      - models/modelo.skops
    metrics:
      - reports/metricas_modelo_base.json:
          cache: false
  evaluate:
    cmd: uv run python -m desercion.evaluate
    deps:
      - models/modelo.skops
      - data/features/test.parquet
      - reports/metricas_modelo_base.json
      - src/desercion/evaluate.py
      - src/desercion/modelado.py
    metrics:
      - reports/evaluacion.json:
          cache: false
  explain:
    cmd: uv run python -m desercion.explain
    deps:
      - models/modelo.skops
      - data/features/train.parquet
      - data/features/test.parquet
      - src/desercion/explain.py
      - src/desercion/modelado.py
    outs:
      - reports/importancia_variables.json:
          cache: false
